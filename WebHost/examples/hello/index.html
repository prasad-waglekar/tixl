<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TiXL web renderer - hello</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" id="card">
    <h1 id="title">TiXL &times; HTML</h1>
    <p class="subtitle">Rendered by Chromium into a TiXL texture</p>

    <svg id="logo" viewBox="0 0 200 200" width="320" height="320" role="img" aria-label="animated logo">
      <defs>
        <linearGradient id="grad-a" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff3a9e"/>
          <stop offset="1" stop-color="#3aa0ff"/>
        </linearGradient>
      </defs>
      <g id="spinner" class="spin">
        <path id="slice-1" d="M100 100 L180 100 A80 80 0 0 1 100 180 Z" fill="url(#grad-a)"/>
        <path id="slice-2" d="M100 100 L100 180 A80 80 0 0 1 20 100 Z" fill="#ffd23a"/>
        <path id="slice-3" d="M100 100 L20 100 A80 80 0 0 1 100 20 Z" fill="#3aff9e"/>
        <path id="slice-4" d="M100 100 L100 20 A80 80 0 0 1 180 100 Z" fill="#ffffff" fill-opacity="0.85"/>
      </g>
      <circle id="core" cx="100" cy="100" r="18" fill="#111"/>
    </svg>

    <div id="bars" aria-hidden="true"></div>
    <p id="clock"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
