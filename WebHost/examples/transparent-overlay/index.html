<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TiXL Transparent Overlay Test</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .hud {
      padding: 24px 48px;
      border: 2px solid rgba(0, 255, 195, 0.85);
      border-radius: 16px;
      background: rgba(12, 18, 28, 0.72);
      color: #00ffc3;
      text-align: center;
      box-shadow: 0 0 32px rgba(0, 255, 195, 0.25);
    }
    h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: 0.08em; }
    p { margin: 0; font-size: 16px; color: #c8f7ec; }
  </style>
</head>
<body>
  <div class="hud">
    <h1>TIXL HUD OVERLAY</h1>
    <p id="status">ALPHA CHANNEL VERIFIED</p>
  </div>
  <script>
    const el = document.getElementById("status");
    function tick(now) {
      el.textContent = "FRAME TIME: " + (now / 1000).toFixed(2) + "s";
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
